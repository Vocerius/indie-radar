<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indie Radar — Витрина инди-проектов</title>
  <style>
    :root {
      --bg: #0f111a;
      --card-bg: #1a1d2b;
      --accent: #6c5ce7;
      --accent-hover: #5b4bc4;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 40px; background: rgba(26, 29, 43, 0.8); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #2d3248;
    }

    .logo { font-size: 24px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--accent); }

    .btn {
      background: var(--accent); color: white; border: none; padding: 10px 20px;
      border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }

    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;
    }

    .card {
      background: var(--card-bg); border-radius: 12px; overflow: hidden;
      border: 1px solid #2d3248; transition: 0.3s; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-5px); border-color: var(--accent); }

    .card-cover { width: 100%; height: 160px; object-fit: cover; background: #25293c; }
    .card-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 18px; margin-bottom: 5px; }
    .card-author { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }
    .card-desc { font-size: 14px; color: #cbd5e1; margin-bottom: 15px; line-height: 1.4; flex-grow: 1; }

    .tags { display: flex; wrap: wrap; gap: 6px; margin-bottom: 15px; }
    .tag { background: #25293c; color: var(--accent); font-size: 11px; padding: 4px 8px; border-radius: 4px; }

    .card-link {
      display: block; text-align: center; background: #25293c; color: white;
      text-decoration: none; padding: 10px; border-radius: 6px; font-weight: 600; transition: 0.2s;
    }
    .card-link:hover { background: var(--accent); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal {
      background: var(--card-bg); padding: 30px; border-radius: 12px; width: 100%; max-width: 500px;
      border: 1px solid #2d3248; position: relative;
    }
    .modal h2 { margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-dim); }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; background: #0f111a; border: 1px solid #2d3248;
      border-radius: 6px; color: white; outline: none;
    }
    .form-group textarea { resize: vertical; height: 80px; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: var(--text-dim); }
  </style>
</head>
<body>

  <header>
    <div class="logo">📡 Indie<span>Radar</span></div>
    <button class="btn" onclick="openModal()">+ Добавить проект</button>
  </header>

  <div class="container">
    <div class="grid" id="games-grid">
      <p style="color: var(--text-dim);">Загрузка проектов...</p>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2>Добавить свой проект</h2>
      <form id="add-game-form">
        <div class="form-group">
          <label>Название игры / приложения *</label>
          <input type="text" id="title" required placeholder="Например: Cyber Adventure">
        </div>
        <div class="form-group">
          <label>Ваш никнейм / Команда *</label>
          <input type="text" id="author" required placeholder="Например: AlexDev">
        </div>
        <div class="form-group">
          <label>Краткое описание *</label>
          <textarea id="description" required placeholder="О чём ваш проект?"></textarea>
        </div>
        <div class="form-group">
          <label>Ссылка на проект (Itch.io, Google Drive, Steam) *</label>
          <input type="url" id="game_url" required placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Ссылка на обложку / скриншот</label>
          <input type="url" id="cover_url" placeholder="https://... (прямая ссылка на картинку)">
        </div>
        <div class="form-group">
          <label>Теги (через запятую)</label>
          <input type="text" id="tags" placeholder="PixelArt, RPG, WebGL">
        </div>
        <button type="submit" class="btn" style="width: 100%;" id="submit-btn">Отправить на модерацию</button>
      </form>
    </div>
  </div>

  <script>

    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxNBexPe-YH8zamTq_9ypGy8PohYiTQs7oyPEvxZCheQSkNM_PzIJH5bmTMh12K2KuB/exec";

    async function loadGames() {
      const grid = document.getElementById('games-grid');
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('Данные пока не опубликованы');
        
        const games = await response.json();
        grid.innerHTML = '';

        if (games.length === 0) {
          grid.innerHTML = '<p style="color: var(--text-dim);">Пока нет опубликованных проектов. Будьте первыми!</p>';
          return;
        }

        games.forEach(game => {
          const cover = game.cover_url || 'https://via.placeholder.com/400x200/25293c/6c5ce7?text=Indie+Radar';
          const tagsHTML = game.tags ? game.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';

          grid.innerHTML += `
            <div class="card">
              <img src="${cover}" class="card-cover" alt="${game.title}">
              <div class="card-body">
                <h3 class="card-title">${game.title}</h3>
                <div class="card-author">Автор: ${game.author}</div>
                <p class="card-desc">${game.description}</p>
                <div class="tags">${tagsHTML}</div>
                <a href="${game.game_url}" target="_blank" class="card-link">Открыть проект</a>
              </div>
            </div>
          `;
        });
      } catch (err) {
        grid.innerHTML = '<p style="color: var(--text-dim);">Пока нет опубликованных проектов. Отправьте первый через кнопку выше!</p>';
      }
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    document.getElementById('add-game-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = 'Отправка...';
      submitBtn.disabled = true;

      const payload = {
        title: document.getElementById('title').value,
        author: document.getElementById('author').value,
        description: document.getElementById('description').value,
        game_url: document.getElementById('game_url').value,
        cover_url: document.getElementById('cover_url').value,
        tags: document.getElementById('tags').value
      };

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        alert('🎉 Проект успешно отправлен! Он появится на сайте после вашей модерации в Google Таблице.');
        closeModal();
        document.getElementById('add-game-form').reset();
      } catch (err) {
        alert('Ошибка отправки: ' + err.toString());
      } finally {
        submitBtn.innerText = 'Отправить на модерацию';
        submitBtn.disabled = false;
      }
    });

    loadGames();
  </script>
</body>
</html>
