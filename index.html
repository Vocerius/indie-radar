<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indie Radar</title>
  <style>
    :root {
      --bg: #090a0f;
      --panel-bg: #12141d;
      --border: #222634;
      --border-focus: #4a5268;
      --text: #ffffff;
      --text-muted: #7e859b;
      --accent-bg: #1c202d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    .frame-container { max-width: 1100px; margin: 0 auto; width: 100%; padding: 0 20px; }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; height: 64px; }

    .logo {
      font-size: 20px; font-weight: 700; letter-spacing: 1px; color: var(--text);
      text-transform: uppercase; text-decoration: none; cursor: pointer;
    }

    .desktop-nav { display: flex; gap: 6px; }
    .nav-btn {
      background: transparent; color: var(--text-muted); border: 1px solid transparent;
      padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: 500;
      cursor: pointer; text-decoration: none; display: flex; align-items: center;
    }
    .nav-btn:hover { color: var(--text); background: var(--accent-bg); }
    .nav-btn.active { color: var(--text); background: var(--accent-bg); border-color: var(--border); }

    .view-content { display: none; padding-top: 24px; }
    .view-content.active { display: block; }

    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }

    .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .input-field, .select-field, .textarea-field {
      background: var(--panel-bg); border: 1px solid var(--border); color: var(--text);
      padding: 10px 14px; border-radius: 4px; font-size: 14px; outline: none; width: 100%;
    }
    .input-field:focus, .select-field:focus, .textarea-field:focus { border-color: var(--border-focus); }
    .search-input { flex-grow: 1; min-width: 200px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

    .card {
      background: var(--panel-bg); border: 1px solid var(--border); border-radius: 6px;
      overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
    }
    .card:hover { border-color: var(--border-focus); }

    .banner-container { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; overflow: hidden; }
    .card-banner { width: 100%; height: 100%; object-fit: cover; }
    
    .card-header-overlay { position: absolute; bottom: 8px; left: 8px; display: flex; align-items: center; }
    .card-icon { width: 36px; height: 36px; aspect-ratio: 1 / 1; border-radius: 4px; border: 1px solid var(--border); object-fit: cover; background: var(--panel-bg); }

    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 8px; }
    .card-desc { font-size: 13px; color: #a0a7bc; margin-bottom: 16px; line-height: 1.4; flex-grow: 1; }

    .tag-list { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tag-item { font-size: 11px; background: var(--accent-bg); color: var(--text-muted); padding: 2px 6px; border-radius: 2px; border: 1px solid var(--border); }

    .btn-action {
      display: block; width: 100%; text-align: center; background: var(--text); color: var(--bg);
      font-weight: 600; font-size: 13px; padding: 10px; border-radius: 4px; text-decoration: none; border: none; cursor: pointer;
    }
    .btn-secondary {
      background: var(--accent-bg); color: var(--text); border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--border-focus); }

    .mobile-nav {
      display: none; position: fixed; bottom: 0; left: 0; width: 100%;
      background: var(--panel-bg); border-top: 1px solid var(--border); z-index: 1000;
      justify-content: space-around; padding: 12px 0; height: 65px;
    }
    .mobile-nav-item {
      color: var(--text-muted); font-size: 12px; font-weight: 600; text-decoration: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer; width: 25%;
    }
    .mobile-nav-item.active { color: var(--text); }

    @media (max-width: 768px) and (orientation: portrait) {
      .desktop-nav { display: none; }
      .mobile-nav { display: flex; }
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-full { grid-column: span 2; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill-item {
      background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);
      padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; user-select: none;
    }
    .pill-item.selected { background: var(--accent-bg); color: var(--text); border-color: var(--border-focus); font-weight: 600; }

    .auth-tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .auth-tab-btn {
      padding: 10px 16px; background: none; border: none; color: var(--text-muted);
      font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .auth-tab-btn.active { color: var(--text); border-bottom-color: var(--text); }

    .loader-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; flex-direction: column;
      justify-content: center; align-items: center; z-index: 3000; gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--text); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="frame-container header-inner">
      <div class="logo" onclick="navigateTo('main')">Indie Radar</div>
      <nav class="desktop-nav">
        <button class="nav-btn" id="btn-main" onclick="navigateTo('main')">Главная</button>
        <button class="nav-btn" id="btn-catalog" onclick="navigateTo('catalog')">Каталог</button>
        <button class="nav-btn" id="btn-add" onclick="navigateTo('add')">+ Добавить проект</button>
        <button class="nav-btn" id="btn-profile" onclick="navigateTo('profile')">Профиль</button>
      </nav>
    </div>
  </header>

  <div class="frame-container">
    
    <div id="view-main" class="view-content">
      <div class="section-title">Новые публикации</div>
      <div class="grid" id="main-grid"></div>
    </div>

    <div id="view-catalog" class="view-content">
      <div class="filter-bar">
        <input type="text" id="searchInput" class="input-field search-input" placeholder="Поиск по названию или автору..." oninput="applyFilters()">
        <select id="typeFilter" class="select-field" style="width: auto;" onchange="applyFilters()">
          <option value="">Все типы</option>
          <option value="game">Игры</option>
          <option value="app">Приложения</option>
          <option value="utility">Утилиты</option>
        </select>
        <select id="devStatusFilter" class="select-field" style="width: auto;" onchange="applyFilters()">
          <option value="">Любой статус</option>
          <option value="Релиз">Релиз</option>
          <option value="Демо">Демо</option>
          <option value="В разработке">В разработке</option>
        </select>
      </div>
      <div class="grid" id="catalog-grid"></div>
    </div>

    <div id="view-add" class="view-content">
      <div class="section-title">Публикация проекта</div>
      <div style="background: var(--panel-bg); border: 1px solid var(--border); padding: 24px; border-radius: 6px; margin-bottom: 40px;">
        <form id="addProjectForm">
          <div class="form-grid">
            
            <div class="form-group">
              <label>Тип проекта *</label>
              <select id="f_type" class="select-field" required>
                <option value="game">Игра</option>
                <option value="app">Приложение</option>
                <option value="utility">Утилита</option>
              </select>
            </div>

            <div class="form-group">
              <label>Название *</label>
              <input type="text" id="f_title" class="input-field" required placeholder="Например: Cyber Runner">
            </div>

            <div class="form-group">
              <label>Автор / Студия *</label>
              <input type="text" id="f_author" class="input-field" required placeholder="Ваш никнейм">
            </div>

            <div class="form-group">
              <label>Движок / Стек</label>
              <input type="text" id="f_engine" class="input-field" placeholder="Unity, Unreal, Godot...">
            </div>

            <div class="form-group">
              <label>URL Иконки (1:1)</label>
              <input type="url" id="f_icon" class="input-field" placeholder="https://.../icon.png">
            </div>

            <div class="form-group">
              <label>URL Баннера (16:9) *</label>
              <input type="url" id="f_banner" class="input-field" required placeholder="https://.../banner.png">
            </div>

            <div class="form-group form-full">
              <label>Краткое описание *</label>
              <input type="text" id="f_desc_short" class="input-field" required maxlength="120" placeholder="До 120 символов">
            </div>

            <div class="form-group form-full">
              <label>Подробное описание</label>
              <textarea id="f_desc_full" class="textarea-field" rows="6" placeholder="Детальная информация о проекте..."></textarea>
            </div>

            <div class="form-group">
              <label>Ссылка на скачивание/игру *</label>
              <input type="url" id="f_download_url" class="input-field" required placeholder="https://...">
            </div>

            <div class="form-group">
              <label>Статус разработки</label>
              <select id="f_status_dev" class="select-field">
                <option value="В разработке">В разработке</option>
                <option value="Демо">Демо</option>
                <option value="Релиз">Релиз</option>
              </select>
            </div>

            <div class="form-group">
              <label>Платформы</label>
              <div class="pill-group" id="platformPills">
                <div class="pill-item" onclick="togglePill(this, 'platform')">Windows</div>
                <div class="pill-item" onclick="togglePill(this, 'platform')">Android</div>
                <div class="pill-item" onclick="togglePill(this, 'platform')">iOS</div>
                <div class="pill-item" onclick="togglePill(this, 'platform')">macOS</div>
                <div class="pill-item" onclick="togglePill(this, 'platform')">Linux</div>
                <div class="pill-item" onclick="togglePill(this, 'platform')">Web</div>
              </div>
            </div>

            <div class="form-group">
              <label>Жанры (до 5)</label>
              <div class="pill-group" id="genrePills">
                <div class="pill-item" onclick="togglePill(this, 'genre', 5)">Экшен</div>
                <div class="pill-item" onclick="togglePill(this, 'genre', 5)">RPG</div>
                <div class="pill-item" onclick="togglePill(this, 'genre', 5)">Стратегия</div>
                <div class="pill-item" onclick="togglePill(this, 'genre', 5)">Платформер</div>
                <div class="pill-item" onclick="togglePill(this, 'genre', 5)">Головоломка</div>
                <div class="pill-item" onclick="togglePill(this, 'genre', 5)">Ужасы</div>
                <div class="pill-item" onclick="togglePill(this, 'genre', 5)">Симулятор</div>
                <div class="pill-item" onclick="togglePill(this, 'genre', 5)">Визуальная новелла</div>
                <div class="pill-item" onclick="togglePill(this, 'genre', 5)">Песочница</div>
              </div>
            </div>

            <div class="form-group">
              <label>Версия</label>
              <input type="text" id="f_version" class="input-field" value="1.0.0">
            </div>

            <div class="form-group">
              <label>Размер файла</label>
              <input type="text" id="f_size" class="input-field" placeholder="150 МБ / Web">
            </div>

            <div class="form-group">
              <label>Возрастной рейтинг</label>
              <select id="f_age_rating" class="select-field">
                <option value="0+">0+</option>
                <option value="6+">6+</option>
                <option value="12+">12+</option>
                <option value="16+">16+</option>
                <option value="18+">18+</option>
              </select>
            </div>

            <div class="form-group">
              <label>Дата релиза</label>
              <input type="date" id="f_release_date" class="input-field">
            </div>

            <div class="form-group form-full">
              <label>Скриншоты (URL через запятую)</label>
              <input type="text" id="f_screenshots" class="input-field" placeholder="https://img1.jpg, https://img2.jpg">
            </div>

            <div class="form-group form-full">
              <label>Видео / Трейлер (URL YouTube)</label>
              <input type="url" id="f_video_trailer" class="input-field" placeholder="https://youtube.com/...">
            </div>

            <div class="form-group form-full">
              <label>Список изменений (Changelog)</label>
              <textarea id="f_changelog" class="textarea-field" rows="3" placeholder="Что нового в этой версии..."></textarea>
            </div>

            <div class="form-full" style="margin-top: 10px;">
              <button type="submit" class="btn-action" style="padding: 14px; font-size: 15px;">Отправить на модерацию</button>
            </div>

          </div>
        </form>
      </div>
    </div>

    <div id="view-project" class="view-content">
      <div id="projectSingleContent"></div>
    </div>

    <div id="view-profile" class="view-content">
      <div id="profileContainer">
        <!-- Заполняется динамически из JS -->
      </div>
    </div>

  </div>

  <nav class="mobile-nav">
    <button class="mobile-nav-item" id="mn-main" onclick="navigateTo('main')">Главная</button>
    <button class="mobile-nav-item" id="mn-catalog" onclick="navigateTo('catalog')">Каталог</button>
    <button class="mobile-nav-item" id="mn-add" onclick="navigateTo('add')">+</button>
    <button class="mobile-nav-item" id="mn-profile" onclick="navigateTo('profile')">Профиль</button>
  </nav>

  <div class="loader-overlay" id="globalLoader">
    <div class="spinner"></div>
    <div style="font-size: 14px; color: var(--text-muted);" id="loaderText">Загрузка данных...</div>
  </div>

  <script>

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxNBexPe-YH8zamTq_9ypGy8PohYiTQs7oyPEvxZCheQSkNM_PzIJH5bmTMh12K2KuB/exec";

    let rawProjects = [];
    let currentUser = JSON.parse(localStorage.getItem('indie_radar_user')) || null;

    function showLoader(text = "Загрузка...") {
      document.getElementById('loaderText').innerText = text;
      document.getElementById('globalLoader').style.display = 'flex';
    }
    function hideLoader() { document.getElementById('globalLoader').style.display = 'none'; }

    function togglePill(el, type, max = 99) {
      if (!el.classList.contains('selected')) {
        const selectedCount = el.parentElement.querySelectorAll('.pill-item.selected').length;
        if (selectedCount >= max) {
          alert(`Максимальное количество выборов: ${max}`);
          return;
        }
        el.classList.add('selected');
      } else {
        el.classList.remove('selected');
      }
    }

    function getSelectedPills(containerId) {
      return Array.from(document.querySelectorAll(`#${containerId} .pill-item.selected`))
        .map(el => el.innerText)
        .join(', ');
    }

    function navigateTo(target, param = null) {
      let url = new URL(window.location.href);
      url.searchParams.delete('p');
      url.searchParams.delete('page');

      if (target === 'project' && param) {
        url.searchParams.set('p', param);
      } else if (target !== 'main') {
        url.searchParams.set('page', target);
      }

      window.history.pushState({}, '', url);
      handleRoute();
    }

    function handleRoute() {
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('p');
      const page = params.get('page') || 'main';

      document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));

      if (projectId) {
        document.getElementById('view-project').classList.add('active');
        renderSingleProject(projectId);
      } else {
        const activeView = document.getElementById('view-' + page) || document.getElementById('view-main');
        activeView.classList.add('active');

        const desktopBtn = document.getElementById('btn-' + page);
        if (desktopBtn) desktopBtn.classList.add('active');

        const mobileBtn = document.getElementById('mn-' + page);
        if (mobileBtn) mobileBtn.classList.add('active');

        if (page === 'profile') renderProfileView();
        if (page === 'add') prepareAddForm();
      }
      window.scrollTo(0, 0);
    }

    window.addEventListener('popstate', handleRoute);

    async function fetchProjects() {
      showLoader("Загрузка платформы...");
      try {
        const res = await fetch('data.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error("Нет данных");
        rawProjects = await res.json();
        renderProjects(rawProjects);
        handleRoute();
      } catch (err) {
        document.getElementById('main-grid').innerHTML = '<p style="color: var(--text-muted)">Проекты пока не опубликованы.</p>';
      } finally {
        hideLoader();
      }
    }

    function createCardHTML(p) {
      const banner = p.banner || 'https://via.placeholder.com/600x337/12141d/7e859b?text=No+Banner';
      const icon = p.icon || 'https://via.placeholder.com/100/12141d/7e859b?text=Icon';
      const genres = p.genres && p.genres.length ? p.genres.split(', ').map(g => `<span class="tag-item">${g}</span>`).join('') : '';

      return `
        <div class="card" onclick="navigateTo('project', '${p.id}')">
          <div class="banner-container">
            <img src="${banner}" class="card-banner" alt="${p.title}">
            <div class="card-header-overlay">
              <img src="${icon}" class="card-icon" alt="${p.title}">
            </div>
          </div>
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="card-meta">
              <span>${p.author}</span> • 
              <span>${p.status_dev || 'В разработке'}</span>
            </div>
            <p class="card-desc">${p.description_short || ''}</p>
            <div class="tag-list">${genres}</div>
            <button class="btn-action">Открыть страницу</button>
          </div>
        </div>
      `;
    }

    function renderProjects(data) {
      const mainGrid = document.getElementById('main-grid');
      const catalogGrid = document.getElementById('catalog-grid');

      if (!data.length) {
        mainGrid.innerHTML = catalogGrid.innerHTML = '<p style="color: var(--text-muted)">Список пуст.</p>';
        return;
      }

      const cardsHTML = data.map(createCardHTML).join('');
      mainGrid.innerHTML = cardsHTML;
      catalogGrid.innerHTML = cardsHTML;
    }

    function renderSingleProject(id) {
      const container = document.getElementById('projectSingleContent');
      const p = rawProjects.find(item => item.id === id);

      if (!p) {
        container.innerHTML = '<p style="color: var(--text-muted)">Проект не найден.</p>';
        return;
      }

      document.title = `${p.title} — Indie Radar`;
      const banner = p.banner || 'https://via.placeholder.com/800x450/12141d/7e859b?text=No+Banner';
      const icon = p.icon || 'https://via.placeholder.com/100/12141d/7e859b?text=Icon';

      let screenshotsHTML = '';
      if (p.screenshots) {
        const list = Array.isArray(p.screenshots) ? p.screenshots : p.screenshots.split(',').map(s => s.trim());
        screenshotsHTML = `
          <div style="margin-top: 24px;">
            <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Скриншоты</div>
            <div style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;">
              ${list.map(src => `<img src="${src}" style="height: 160px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; border: 1px solid var(--border);">`).join('')}
            </div>
          </div>
        `;
      }

      let videoHTML = '';
      if (p.video_trailer) {
        let embedUrl = p.video_trailer.replace("watch?v=", "embed/");
        videoHTML = `
          <div style="margin-top: 24px;">
            <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Трейлер</div>
            <div style="aspect-ratio: 16/9; width: 100%;">
              <iframe src="${embedUrl}" style="width: 100%; height: 100%; border: none; border-radius: 6px;"></iframe>
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div style="margin-bottom: 16px;">
          <button onclick="navigateTo('catalog')" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px;">← Назад в каталог</button>
        </div>

        <div style="position: relative; aspect-ratio: 16/9; width: 100%; border-radius: 6px; overflow: hidden; margin-bottom: 20px;">
          <img src="${banner}" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
          <img src="${icon}" style="width: 64px; height: 64px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover;">
          <div>
            <h1 style="font-size: 24px; font-weight: 700;">${p.title}</h1>
            <div style="color: var(--text-muted); font-size: 14px;">Автор: ${p.author}</div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; background: var(--panel-bg); padding: 16px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 24px; font-size: 12px;">
          <div><span style="color: var(--text-muted)">Статус:</span><br><strong>${p.status_dev || '—'}</strong></div>
          <div><span style="color: var(--text-muted)">Версия:</span><br><strong>${p.version || '1.0'}</strong></div>
          <div><span style="color: var(--text-muted)">Движок:</span><br><strong>${p.engine || '—'}</strong></div>
          <div><span style="color: var(--text-muted)">Размер:</span><br><strong>${p.size || '—'}</strong></div>
          <div><span style="color: var(--text-muted)">Платформы:</span><br><strong>${p.platform || '—'}</strong></div>
          <div><span style="color: var(--text-muted)">Возраст:</span><br><strong>${p.age_rating || '0+'}</strong></div>
        </div>

        <div style="font-size: 15px; line-height: 1.6; color: #cbd5e1; white-space: pre-line; margin-bottom: 24px;">
          ${p.description_full || p.description_short || 'Описание отсутствует.'}
        </div>

        ${videoHTML}
        ${screenshotsHTML}

        ${p.changelog ? `
          <div style="margin-top: 24px; background: var(--panel-bg); padding: 16px; border-radius: 6px; border: 1px solid var(--border);">
            <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">Список изменений</div>
            <div style="font-size: 13px; color: var(--text-muted); white-space: pre-line;">${p.changelog}</div>
          </div>
        ` : ''}

        <div style="margin-top: 32px; margin-bottom: 40px;">
          <a href="${p.download_url}" target="_blank" class="btn-action" style="font-size: 16px; padding: 14px;">Скачать / Перейти к игре</a>
        </div>
      `;
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const type = document.getElementById('typeFilter').value;
      const status = document.getElementById('devStatusFilter').value;

      const filtered = rawProjects.filter(p => {
        const matchesSearch = p.title.toLowerCase().includes(search) || p.author.toLowerCase().includes(search);
        const matchesType = !type || p.type === type;
        const matchesStatus = !status || p.status_dev === status;
        return matchesSearch && matchesType && matchesStatus;
      });

      document.getElementById('catalog-grid').innerHTML = filtered.map(createCardHTML).join('') || '<p style="color: var(--text-muted)">Ничего не найдено.</p>';
    }

    function renderProfileView() {
      const container = document.getElementById('profileContainer');

      if (!currentUser) {
        container.innerHTML = `
          <div style="max-width: 440px; margin: 0 auto; background: var(--panel-bg); border: 1px solid var(--border); padding: 28px; border-radius: 8px;">
            <div class="auth-tabs">
              <button class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Вход</button>
              <button class="auth-tab-btn" id="tab-register" onclick="switchAuthTab('register')">Регистрация</button>
            </div>

            <!-- Форма Входа -->
            <form id="loginForm" onsubmit="handleLogin(event)">
              <div class="form-group" style="margin-bottom: 14px;">
                <label>Никнейм или Email</label>
                <input type="text" id="auth_login" class="input-field" required>
              </div>
              <div class="form-group" style="margin-bottom: 20px;">
                <label>Пароль</label>
                <input type="password" id="auth_password" class="input-field" required>
              </div>
              <button type="submit" class="btn-action" style="padding: 12px;">Войти</button>
            </form>

            <!-- Форма Регистрации -->
            <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
              <div class="form-group" style="margin-bottom: 14px;">
                <label>Никнейм *</label>
                <input type="text" id="reg_username" class="input-field" required placeholder="Gamer123">
              </div>
              <div class="form-group" style="margin-bottom: 14px;">
                <label>Email *</label>
                <input type="email" id="reg_email" class="input-field" required placeholder="user@example.com">
              </div>
              <div class="form-group" style="margin-bottom: 14px;">
                <label>Пароль *</label>
                <input type="password" id="reg_password" class="input-field" required>
              </div>
              <div class="form-group" style="margin-bottom: 20px;">
                <label>URL Аватарки (необязательно)</label>
                <input type="url" id="reg_avatar" class="input-field" placeholder="https://...">
              </div>
              <button type="submit" class="btn-action" style="padding: 12px;">Зарегистрироваться</button>
            </form>

          </div>
        `;
      } else {
        const userProjects = rawProjects.filter(p => p.author === currentUser.username || p.author_id === currentUser.id);
        const myProjectsHTML = userProjects.length ? userProjects.map(createCardHTML).join('') : '<p style="color: var(--text-muted)">Вы еще не опубликовали ни одного проекта.</p>';

        container.innerHTML = `
          <div style="background: var(--panel-bg); border: 1px solid var(--border); padding: 24px; border-radius: 8px; margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 16px;">
              <img src="${currentUser.avatar}" style="width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--border); object-fit: cover;">
              <div>
                <h2 style="font-size: 20px; font-weight: 700;">${currentUser.username}</h2>
                <div style="font-size: 13px; color: var(--text-muted);">${currentUser.email}</div>
              </div>
            </div>
            <button onclick="logout()" class="btn-action btn-secondary" style="width: auto; padding: 10px 20px;">Выйти из аккаунта</button>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div class="section-title" style="margin-bottom: 0;">Мои проекты (${userProjects.length})</div>
            <button onclick="navigateTo('add')" class="btn-action" style="width: auto; padding: 8px 16px;">+ Добавить новый</button>
          </div>

          <div class="grid">${myProjectsHTML}</div>
        `;
      }
    }

    function switchAuthTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      showLoader("Авторизация...");

      const payload = {
        action: 'login',
        login: document.getElementById('auth_login').value,
        password: document.getElementById('auth_password').value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          currentUser = result.user;
          localStorage.setItem('indie_radar_user', JSON.stringify(currentUser));
          renderProfileView();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Ошибка сети: " + err.toString());
      } finally {
        hideLoader();
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      showLoader("Создание аккаунта...");

      const payload = {
        action: 'register',
        username: document.getElementById('reg_username').value,
        email: document.getElementById('reg_email').value,
        password: document.getElementById('reg_password').value,
        avatar: document.getElementById('reg_avatar').value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          alert("Регистрация завершена!");
          currentUser = result.user;
          localStorage.setItem('indie_radar_user', JSON.stringify(currentUser));
          renderProfileView();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Ошибка регистрации: " + err.toString());
      } finally {
        hideLoader();
      }
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('indie_radar_user');
      renderProfileView();
    }

    function prepareAddForm() {
      const authorInput = document.getElementById('f_author');
      if (currentUser) {
        authorInput.value = currentUser.username;
        authorInput.readOnly = true;
      } else {
        authorInput.value = '';
        authorInput.readOnly = false;
      }
    }

    document.getElementById('addProjectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showLoader("Отправка проекта...");

      const payload = {
        action: 'create_project',
        type: document.getElementById('f_type').value,
        title: document.getElementById('f_title').value,
        author: document.getElementById('f_author').value,
        author_id: currentUser ? currentUser.id : '',
        engine: document.getElementById('f_engine').value,
        icon: document.getElementById('f_icon').value,
        banner: document.getElementById('f_banner').value,
        description_short: document.getElementById('f_desc_short').value,
        description_full: document.getElementById('f_desc_full').value,
        download_url: document.getElementById('f_download_url').value,
        status_dev: document.getElementById('f_status_dev').value,
        version: document.getElementById('f_version').value,
        size: document.getElementById('f_size').value,
        platform: getSelectedPills('platformPills'),
        genres: getSelectedPills('genrePills'),
        age_rating: document.getElementById('f_age_rating').value,
        release_date: document.getElementById('f_release_date').value,
        screenshots: document.getElementById('f_screenshots').value,
        video_trailer: document.getElementById('f_video_trailer').value,
        changelog: document.getElementById('f_changelog').value
      };

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        alert("Проект отправлен на модерацию!");
        document.getElementById('addProjectForm').reset();
        document.querySelectorAll('.pill-item.selected').forEach(el => el.classList.remove('selected'));
        navigateTo('catalog');
      } catch (err) {
        alert("Ошибка при отправке: " + err.toString());
      } finally {
        hideLoader();
      }
    });

    fetchProjects();
  </script>
</body>
</html>
